# Docker Configuration for Adaptive Exam AI

version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: adaptive_exam_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - adaptive_exam_network

  # Redis for Channels and Celery
  redis:
    image: redis:7-alpine
    container_name: adaptive_exam_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - adaptive_exam_network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_exam_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - adaptive_exam_network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_exam_celery_worker
    restart: always
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - adaptive_exam_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_exam_celery_beat
    restart: always
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - adaptive_exam_network

  # Nginx (Production)
  nginx:
    image: nginx:alpine
    container_name: adaptive_exam_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
    networks:
      - adaptive_exam_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  adaptive_exam_network:
    driver: bridge
